
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Superhero Cards</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f4ff;
            text-align: center;
            padding: 30px;
        }

        h1 {
            color: #ff4d4d;
        }

        p {
            color: #444444;
        }

        button {
            background-color: #ff4d4d;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
        }

        .card-container {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 25px;
            flex-wrap: wrap;
        }

        .hero-card {
            background-color: white;
            border: 3px solid #ff4d4d;
            border-radius: 12px;
            width: 220px;
            padding: 18px;
        }

        .hero-name {
            font-size: 22px;
            font-weight: bold;
            color: #222222;
        }

        .hero-power {
            color: #0057b8;
            font-weight: bold;
        }

        .hero-mission {
            color: #666666;
            font-size: 14px;
        }
    </style>
</head>

<body>

    <h1>My Superhero Power Cards</h1>
    <p>Click the button to create superhero objects using JavaScript classes!</p>

    <button onclick="showheroes()">Show Super Heroes</button>

    <div class="card-container">
        <div id="card1"></div>
        <div id="card2"></div>
        <div id="card3"></div>
    </div>

    <script>
        class Superhero {
            constructor(name, power, mission) {
                this.name = name;
                this.power = power;
                this.mission = mission;
            }

            describe() {
                return `
                    <div class="hero-card">
                        <div class="hero-name">${this.name}</div>
                        <p class="hero-power">Power: ${this.power}</p>
                        <p class="hero-mission">Mission: ${this.mission}</p>
                    </div>
                `;
            }
        }

        function showheroes() {
            let p1 = new Superhero(
                "Superman",
                "Incredible strength",
                "Protect Earth"
            );

            let p2 = new Superhero(
                "Batman",
                "Advanced technology",
                "Fight crime and solve mysteries"
            );

            let p3 = new Superhero(
                "Spider-Man",
                "Web-swinging",
                "Protect New York City"
            );

            document.getElementById("card1").innerHTML = p1.describe();
            document.getElementById("card2").innerHTML = p2.describe();
            document.getElementById("card3").innerHTML = p3.describe();
        }
    </script>

</body>
</html>
